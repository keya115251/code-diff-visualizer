apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: diff-visualizer
  labels:
    app: ollama
    app.kubernetes.io/part-of: diff-visualizer
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the ReadWriteOnce PVC can't be attached to
  # an old and a new pod at the same time during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # NOTE: the official ollama/ollama image runs as root and keeps models in
      # /root/.ollama. It is left as root on purpose; running it non-root would
      # need a custom image or a different OLLAMA_MODELS path.
      containers:
        - name: ollama
          # Pinned instead of :latest so a pod restart can't silently upgrade it
          image: ollama/ollama:0.40.0
          ports:
            - name: http
              containerPort: 11434
          # No envFrom here: the image already sets OLLAMA_HOST=0.0.0.0:11434
          # as the bind address, which the ConfigMap's client URL would override.
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          # GET / returns "Ollama is running" once the server accepts requests
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          # Generous memory: the 1.5b model takes ~1-2 GiB when loaded, plus
          # headroom for the context window. Raise it for a larger model.
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 4Gi
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  # Name must stay "ollama": the backend and the Job reach it at http://ollama:11434
  name: ollama
  namespace: diff-visualizer
  labels:
    app: ollama
    app.kubernetes.io/part-of: diff-visualizer
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http

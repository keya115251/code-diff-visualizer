services:
  ollama:
    image: ollama/ollama:latest
    container_name: diff-visualizer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: diff-visualizer-backend
    environment:
      - PORT=4000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:1.5b
      - DB_PATH=/app/data/data.sqlite
    volumes:
      - backend-data:/app/data
    ports:
      - "4000:4000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: diff-visualizer-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama-data:
  backend-data:
